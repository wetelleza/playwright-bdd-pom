name: Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'ai/**'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC — no long-lived AWS keys stored in GitHub
  contents: read

jobs:
  deploy:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # ai/ is a sibling of infra/, not a descendant — Node module resolution for its imports
      # (e.g. ai/grounding.ts's @cucumber/cucumber-expressions) walks up from ai/ itself, not from
      # infra/, so it needs the repo root's own node_modules, matching local dev.
      - name: Install root dependencies
        run: npm ci

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: Build Lambda bundle
        run: npm run build
        working-directory: infra

      # Idempotent — safe to run on every deploy instead of requiring a separate manual step.
      - name: CDK bootstrap
        run: npx cdk bootstrap
        working-directory: infra
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: CDK deploy
        run: npx cdk deploy --require-approval never --outputs-file outputs.json
        working-directory: infra
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Same "verify against the real thing" discipline as the rest of this project — proves the
      # deployed endpoint actually answers (happy path, validation, auth), not just that
      # `cdk deploy` returned success. Runs at repo root: features/, steps/ and playwright.config.ts
      # all live there, not under infra/.
      # Temporary — /catalog returned 403 to every call in the last run while /generate on the
      # same key/stage succeeded, so print the raw response (AWS's error message distinguishes a
      # bad-key rejection from a routing mismatch) instead of guessing. Remove once diagnosed.
      - name: Debug catalog endpoint
        run: |
          export LAMBDA_API_URL=$(node -p "require('./infra/outputs.json').GenerateScenarioStack.ApiBaseUrl")
          API_KEY_ID=$(node -p "require('./infra/outputs.json').GenerateScenarioStack.ApiKeyId")
          export LAMBDA_API_KEY=$(aws apigateway get-api-key --api-key "$API_KEY_ID" --include-value --query value --output text)
          echo "GET ${LAMBDA_API_URL}catalog?suite=demoqa"
          curl -sS -i -H "x-api-key: $LAMBDA_API_KEY" "${LAMBDA_API_URL}catalog?suite=demoqa"
          echo ""
          echo "--- for comparison, POST generate with the same key ---"
          curl -sS -i -H "x-api-key: $LAMBDA_API_KEY" -H "Content-Type: application/json" \
            -d '{"description":"Verify the page title is visible","suite":"demoqa"}' \
            "${LAMBDA_API_URL}generate"

      - name: Test the deployed endpoint
        run: |
          export LAMBDA_API_URL=$(node -p "require('./infra/outputs.json').GenerateScenarioStack.ApiBaseUrl")
          API_KEY_ID=$(node -p "require('./infra/outputs.json').GenerateScenarioStack.ApiKeyId")
          export LAMBDA_API_KEY=$(aws apigateway get-api-key --api-key "$API_KEY_ID" --include-value --query value --output text)

          echo "Testing $LAMBDA_API_URL"
          npx bddgen
          npx playwright test --project=api --grep @lambda
