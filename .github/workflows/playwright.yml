name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # If these don't exist yet, Docker Compose creates them as part of setting up the bind
      # mounts in docker-compose.yml — owned by root, since the container runs as root. That
      # leaves the runner user unable to write the executive report afterward. Pre-creating them
      # here (as the runner user) means Compose just reuses the existing, runner-owned folders.
      - name: Prepare report directories
        run: mkdir -p playwright-report cucumber-report executive-report test-results

      - name: Build Docker images
        run: docker compose build

      # Runs the whole suite (chromium/firefox/webkit + api) inside containers — same
      # environment on every machine, sidesteps host-specific quirks entirely. `tests` depends
      # on `api` being healthy, so compose starts it automatically. Reports land on the host via
      # the volumes in docker-compose.yml.
      - name: Run test suite in Docker
        run: docker compose run --rm tests

      - name: Stop containers
        if: ${{ !cancelled() }}
        run: docker compose down

      - name: Generate executive report
        if: ${{ !cancelled() }}
        run: npm run report:exec

      - name: Upload executive report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: executive-report
          path: executive-report/
          retention-days: 14

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Cucumber report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: cucumber-report/
          retention-days: 14
